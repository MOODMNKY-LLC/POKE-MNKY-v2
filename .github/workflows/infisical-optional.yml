# Opt-in only. Pull requests, forks, and the default Test workflow do not run this.
# The job stays skipped until a maintainer sets the repository variable
# INFISICAL_ENABLED to true and dispatches the workflow.
name: Infisical optional

on:
  workflow_dispatch:

jobs:
  smoke:
    if: ${{ vars.INFISICAL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Infisical CLI
        run: npm install -g @infisical/cli

      - name: Read one Infisical environment into a no-op command
        env:
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_DEPLOYMENT_SLOT: ${{ vars.INFISICAL_DEPLOYMENT_SLOT }}
          INFISICAL_AUTH: universal-auth
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
        run: pnpm secrets:run -- node -e "process.exit(0)"
