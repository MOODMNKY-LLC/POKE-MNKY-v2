# aab-netbird-onboard: creates and revokes NetBird invites for the POKE MNKY app.
#
# Deploys change production; get Simeon's approval first. See docs/NETBIRD-AUTOMATED-ONBOARDING.md for the ordered rollout.
#
# Secrets (set by a human with `wrangler secret put <NAME>`; never commit values, never put them in [vars]):
#   NETBIRD_API_TOKEN  NetBird personal access token of a dedicated service user that may create invites
#   DISCORD_BOT_TOKEN  Discord bot token used only to send DMs
#   SIGNING_SECRET     shared HMAC secret; must equal NETBIRD_ONBOARD_SIGNING_SECRET in Vercel

name = "aab-netbird-onboard"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# The Worker's own switch, on by default to match production. Anything other than the exact string "true" means OFF (HTTP 503).
# The app's NETBIRD_ONBOARDING_ENABLED in Vercel is the main kill switch, because when it is off the app never calls the Worker.
ONBOARDING_ENABLED = "true"
NETBIRD_API_BASE = "https://netbird.moodmnky.com"
# NetBird group id of the "Average At Best: Pokemon Battle League" group. Every invited member is placed only in this group.
# Empty would make the Worker refuse to create invites.
NETBIRD_LEAGUE_GROUP_ID = "d74jgats4d1s73au3agg"
# 72 hours
INVITE_TTL_SECONDS = "259200"
# Maximum new or regenerated invites per UTC day.
DAILY_INVITE_CAP = "20"

[[kv_namespaces]]
binding = "ONBOARD_KV"
id = "471e8beb1be44900990706649bcc901d"
